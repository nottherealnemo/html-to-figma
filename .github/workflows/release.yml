name: Release
# Push a tag like v1.6.2 to publish a release with the installable zip attached.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches the plugin version
        run: |
          V=$(sed -n "s/^const PLUGIN_VERSION = '\([0-9.]*\)'.*/\1/p" code.js)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} but code.js says $V"; exit 1; }
      - name: Build zip
        run: scripts/build-release.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${GITHUB_REF_NAME#v}
          awk -v v="$V" '$0 ~ "^## "v" " {p=1; next} /^## / && p {exit} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "HTML to Figma $GITHUB_REF_NAME" --notes-file notes.md
