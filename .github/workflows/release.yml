name: Release
# Publish a release on GitHub (Releases → Draft a new release → tag e.g. v1.6.2 → Publish).
# This workflow then builds the installable zip and attaches it to that release.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Check tag matches the plugin version
        run: |
          V=$(sed -n "s/^const PLUGIN_VERSION = '\([0-9.]*\)'.*/\1/p" code.js)
          TAG="${{ github.event.release.tag_name }}"
          [ "v$V" = "$TAG" ] || { echo "Release tag $TAG but code.js says $V"; exit 1; }
      - name: Build zip
        run: scripts/build-release.sh
      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
