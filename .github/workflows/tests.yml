name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and fonts for rendering tests
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          # Same fonts as the machines the tests were tuned on (pages use Inter; serif/sans fallbacks)
          sudo apt-get install -y fonts-inter fonts-liberation fonts-dejavu-core
          fc-match Inter
      - name: Run test suite
        run: python tests/run_tests.py
