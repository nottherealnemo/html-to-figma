<!doctype html><html><head><style>
body{font-family:Georgia,serif;margin:40px;background:linear-gradient(135deg,#fdf2f8,#eff6ff)}
.stack{position:relative;height:160px}
.stack div{position:absolute;width:120px;height:120px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font:600 20px/1 system-ui}
.a{background:#ef4444;left:0;top:0;z-index:3}.b{background:#3b82f6;left:60px;top:20px;z-index:1}.c{background:#10b981;left:120px;top:40px;z-index:2}
.glass{margin-top:20px;padding:20px;background:rgba(255,255,255,.5);backdrop-filter:blur(8px);border-radius:16px;border:1px solid rgba(255,255,255,.8)}
.inline-mix{font-size:18px;line-height:28px;max-width:420px}
.inline-mix mark{background:#fde68a;padding:0 4px}
pre{background:#111;color:#e5e7eb;padding:12px;border-radius:8px;font-size:12px}
</style></head><body>
<h1 id="t"></h1>
<div class="stack"><div class="a">A</div><div class="b">B</div><div class="c">C</div></div>
<div class="glass inline-mix">Text that starts here and then has a <mark>highlighted phrase</mark> that continues on, wrapping across several lines with <i>italic</i> and <s>struck</s> words 🎉.</div>
<pre>function hi() {
  return "pre text";
}</pre>
<script>document.getElementById('t').textContent='Rendered by JavaScript';</script>
</body></html>
